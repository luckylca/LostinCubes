name: Scheduled GitHub Pages Recovery

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: pages-scheduled-recovery
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-slim
    timeout-minutes: 15
    steps:
      - name: Mark scheduled deployment pending
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          node --input-type=module > "${RUNNER_TEMP}/status.json" <<'NODE'
          process.stdout.write(JSON.stringify({
            state: 'pending',
            context: 'pages/scheduled-recovery',
            description: 'Scheduled Pages recovery is running',
            target_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
          }));
          NODE
          curl --fail-with-body --silent --show-error --location \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "https://api.github.com/repos/${REPOSITORY}/statuses/${COMMIT_SHA}" \
            --data-binary "@${RUNNER_TEMP}/status.json"

      - name: Checkout current main
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Prepare visible build metadata
        shell: bash
        run: |
          set -euo pipefail
          APP_VERSION=$(node -e "process.stdout.write(JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version)")
          echo "VITE_APP_VERSION=${APP_VERSION}" >> "$GITHUB_ENV"
          echo "VITE_BUILD_NUMBER=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "VITE_COMMIT_SHA=${GITHUB_SHA}" >> "$GITHUB_ENV"
          echo "VITE_BUILD_TIME=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Build production site
        run: npm run build

      - name: Write public deployment marker
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          writeFileSync('dist/version.json', `${JSON.stringify({
            version: process.env.VITE_APP_VERSION,
            build: process.env.VITE_BUILD_NUMBER,
            commit: process.env.VITE_COMMIT_SHA,
            builtAt: process.env.VITE_BUILD_TIME,
          }, null, 2)}\n`);
          NODE

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-slim
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify public version marker
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          MARKER_URL="${PAGE_URL%/}/version.json"
          for ATTEMPT in $(seq 1 60); do
            MARKER=$(curl --fail --silent --show-error --location \
              "${MARKER_URL}?run=${GITHUB_RUN_ID}&attempt=${ATTEMPT}") || true
            if printf '%s' "$MARKER" | grep -Fq "\"commit\": \"${EXPECTED_SHA}\""; then
              printf '%s\n' "$MARKER"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Public Pages did not report ${EXPECTED_SHA}."
          exit 1

  report:
    if: always()
    needs: [build, deploy]
    runs-on: ubuntu-slim
    timeout-minutes: 5
    steps:
      - name: Report scheduled deployment result
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
        run: |
          set -euo pipefail
          if [ "${BUILD_RESULT}" = 'success' ] && [ "${DEPLOY_RESULT}" = 'success' ]; then
            STATE='success'
            DESCRIPTION='Public Pages serves this scheduled build'
          else
            STATE='failure'
            DESCRIPTION="Scheduled Pages failed: build=${BUILD_RESULT}, deploy=${DEPLOY_RESULT}"
          fi
          STATE="${STATE}" DESCRIPTION="${DESCRIPTION}" node --input-type=module > "${RUNNER_TEMP}/status.json" <<'NODE'
          process.stdout.write(JSON.stringify({
            state: process.env.STATE,
            context: 'pages/scheduled-recovery',
            description: process.env.DESCRIPTION,
            target_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
          }));
          NODE
          curl --fail-with-body --silent --show-error --location \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "https://api.github.com/repos/${REPOSITORY}/statuses/${COMMIT_SHA}" \
            --data-binary "@${RUNNER_TEMP}/status.json"
