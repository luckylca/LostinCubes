name: Release CI

on:
  pull_request:
    branches: ['main']
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: release-ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate-release:
    if: github.event.pull_request.head.repo.full_name == github.repository && startsWith(github.event.pull_request.head.ref, 'release/')
    runs-on: ubuntu-slim
    timeout-minutes: 15
    env:
      RELEASE_SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Clone exact release commit
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout "https://github.com/${REPOSITORY}.git" source
          git -C source checkout --detach "${RELEASE_SHA}"
          test "$(git -C source rev-parse HEAD)" = "${RELEASE_SHA}"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          cd source
          npm install

      - name: Typecheck, lint, test, and build
        shell: bash
        run: |
          set -euo pipefail
          cd source
          npm run typecheck
          npm run lint
          npm run test
          npm run build
