name: Deploy Pages After CI

on:
  workflow_run:
    workflows: ['CI']
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: pages-after-ci
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'release/')
    runs-on: ubuntu-22.04
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Mark deployment pending
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          node --input-type=module > "${RUNNER_TEMP}/status.json" <<'NODE'
          process.stdout.write(JSON.stringify({
            state: 'pending',
            context: 'pages/deployment-after-ci',
            description: 'CI passed; Pages build is running',
            target_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
          }));
          NODE
          curl --fail-with-body --silent --show-error --location \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "https://api.github.com/repos/${REPOSITORY}/statuses/${DEPLOY_SHA}" \
            --data-binary "@${RUNNER_TEMP}/status.json"

      - name: Checkout validated release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Prepare build metadata
        shell: bash
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          APP_VERSION=$(node -e "process.stdout.write(JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version)")
          echo "VITE_APP_VERSION=${APP_VERSION}" >> "$GITHUB_ENV"
          echo "VITE_BUILD_NUMBER=${BUILD_NUMBER}" >> "$GITHUB_ENV"
          echo "VITE_COMMIT_SHA=${DEPLOY_SHA}" >> "$GITHUB_ENV"
          echo "VITE_BUILD_TIME=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"

      - name: Build production site
        run: npm run build

      - name: Write deployment marker
        shell: bash
        run: |
          set -euo pipefail
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          writeFileSync('dist/version.json', `${JSON.stringify({
            version: process.env.VITE_APP_VERSION,
            build: process.env.VITE_BUILD_NUMBER,
            commit: process.env.VITE_COMMIT_SHA,
            builtAt: process.env.VITE_BUILD_TIME,
          }, null, 2)}\n`);
          NODE

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Deploy Pages artifact
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify public deployment marker
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          set -euo pipefail
          MARKER_URL="${PAGE_URL%/}/version.json"
          for ATTEMPT in $(seq 1 60); do
            MARKER=$(curl --fail --silent --show-error --location \
              "${MARKER_URL}?run=${GITHUB_RUN_ID}&attempt=${ATTEMPT}") || true
            if printf '%s' "${MARKER}" | grep -Fq "\"commit\": \"${DEPLOY_SHA}\""; then
              printf '%s\n' "${MARKER}"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Public Pages did not report ${DEPLOY_SHA}."
          exit 1

      - name: Mark deployment successful
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          node --input-type=module > "${RUNNER_TEMP}/status.json" <<'NODE'
          process.stdout.write(JSON.stringify({
            state: 'success',
            context: 'pages/deployment-after-ci',
            description: 'Public Pages serves this validated release',
            target_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
          }));
          NODE
          curl --fail-with-body --silent --show-error --location \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "https://api.github.com/repos/${REPOSITORY}/statuses/${DEPLOY_SHA}" \
            --data-binary "@${RUNNER_TEMP}/status.json"

  report-failure:
    if: always() && (needs.build.result == 'failure' || needs.deploy.result == 'failure')
    needs: [build, deploy]
    runs-on: ubuntu-22.04
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Mark deployment failed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          node --input-type=module > "${RUNNER_TEMP}/status.json" <<'NODE'
          process.stdout.write(JSON.stringify({
            state: 'failure',
            context: 'pages/deployment-after-ci',
            description: 'Pages deployment failed after successful CI',
            target_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
          }));
          NODE
          curl --fail-with-body --silent --show-error --location \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "https://api.github.com/repos/${REPOSITORY}/statuses/${DEPLOY_SHA}" \
            --data-binary "@${RUNNER_TEMP}/status.json"
