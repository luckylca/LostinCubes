name: Deploy Pages After Release CI

on:
  workflow_run:
    workflows: ['Release CI']
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write
  statuses: write

concurrency:
  group: pages-release-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: true

jobs:
  build:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      startsWith(github.event.workflow_run.head_branch, 'release/')
    runs-on: ubuntu-slim
    timeout-minutes: 15
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact_id }}
      deploy_sha: ${{ steps.target.outputs.deploy_sha }}
    steps:
      - name: Resolve release commit
        id: target
        shell: bash
        run: echo "deploy_sha=${DEPLOY_SHA}" >> "${GITHUB_OUTPUT}"

      - name: Mark deployment pending
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          node --input-type=module > "${RUNNER_TEMP}/status.json" <<'NODE'
          process.stdout.write(JSON.stringify({
            state: 'pending',
            context: 'pages/release-deployment',
            description: 'Release CI passed; Pages build is running',
            target_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
          }));
          NODE
          curl --fail-with-body --silent --show-error --location \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "https://api.github.com/repos/${REPOSITORY}/statuses/${DEPLOY_SHA}" \
            --data-binary "@${RUNNER_TEMP}/status.json"

      - name: Clone exact validated release
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout "https://github.com/${REPOSITORY}.git" source
          git -C source checkout --detach "${DEPLOY_SHA}"
          test "$(git -C source rev-parse HEAD)" = "${DEPLOY_SHA}"

      - name: Build production site
        shell: bash
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          cd source
          npm install
          export VITE_APP_VERSION="$(node -e "process.stdout.write(JSON.parse(require('node:fs').readFileSync('package.json','utf8')).version)")"
          export VITE_BUILD_NUMBER="${BUILD_NUMBER}"
          export VITE_COMMIT_SHA="${DEPLOY_SHA}"
          export VITE_BUILD_TIME="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
          npm run build
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';
          writeFileSync('dist/version.json', `${JSON.stringify({
            version: process.env.VITE_APP_VERSION,
            build: process.env.VITE_BUILD_NUMBER,
            commit: process.env.VITE_COMMIT_SHA,
            builtAt: process.env.VITE_BUILD_TIME,
          }, null, 2)}\n`);
          NODE
          touch dist/.nojekyll

      - name: Package Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          tar --dereference --hard-dereference \
            --directory source/dist \
            -cvf "${RUNNER_TEMP}/artifact.tar" \
            --exclude=.git --exclude=.github --exclude='.[^/]*' .
          test -s "${RUNNER_TEMP}/artifact.tar"

      - name: Upload Pages artifact
        id: upload
        shell: bash
        run: |
          set -euo pipefail
          TOOLS_DIR="${RUNNER_TEMP}/pages-tools"
          mkdir -p "${TOOLS_DIR}"
          cd "${TOOLS_DIR}"
          npm init -y >/dev/null
          npm install --no-audit --no-fund @actions/artifact@6.2.1
          cat > upload.mjs <<'NODE'
          import { appendFileSync } from 'node:fs';
          import { DefaultArtifactClient } from '@actions/artifact';
          const client = new DefaultArtifactClient();
          const result = await client.uploadArtifact(
            'github-pages',
            [process.env.ARTIFACT_PATH],
            process.env.RUNNER_TEMP,
            { retentionDays: 1 },
          );
          if (!result.id) throw new Error('Artifact upload did not return an id.');
          appendFileSync(process.env.GITHUB_OUTPUT, `artifact_id=${result.id}\n`);
          NODE
          ARTIFACT_PATH="${RUNNER_TEMP}/artifact.tar" node upload.mjs

  deploy:
    needs: build
    runs-on: ubuntu-slim
    timeout-minutes: 15
    environment:
      name: github-pages
      url: https://luckylca.github.io/LostinCubes/
    env:
      DEPLOY_SHA: ${{ needs.build.outputs.deploy_sha }}
      ARTIFACT_ID: ${{ needs.build.outputs.artifact_id }}
    steps:
      - name: Create Pages deployment
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          OIDC_JSON="$(curl --fail-with-body --silent --show-error --location \
            --retry 5 --retry-all-errors \
            -H "Authorization: Bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}")"
          OIDC_TOKEN="$(printf '%s' "${OIDC_JSON}" | node -e "let s='';process.stdin.on('data',d=>s+=d).on('end',()=>process.stdout.write(JSON.parse(s).value))")"
          PAYLOAD="$(OIDC_TOKEN="${OIDC_TOKEN}" node --input-type=module <<'NODE'
          process.stdout.write(JSON.stringify({
            artifact_id: Number(process.env.ARTIFACT_ID),
            environment: 'github-pages',
            pages_build_version: process.env.DEPLOY_SHA,
            oidc_token: process.env.OIDC_TOKEN,
          }));
          NODE
          )"
          curl --fail-with-body --silent --show-error --location \
            --retry 5 --retry-all-errors \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "https://api.github.com/repos/${REPOSITORY}/pages/deployments" \
            -d "${PAYLOAD}"

      - name: Verify public version marker
        shell: bash
        run: |
          set -euo pipefail
          MARKER_URL='https://luckylca.github.io/LostinCubes/version.json'
          for ATTEMPT in $(seq 1 60); do
            MARKER="$(curl --fail --silent --show-error --location \
              "${MARKER_URL}?run=${GITHUB_RUN_ID}&attempt=${ATTEMPT}")" || true
            if printf '%s' "${MARKER}" | grep -Fq "\"commit\": \"${DEPLOY_SHA}\""; then
              printf '%s\n' "${MARKER}"
              exit 0
            fi
            sleep 5
          done
          echo "::error::Public Pages did not report ${DEPLOY_SHA}."
          exit 1

      - name: Mark deployment successful
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          node --input-type=module > "${RUNNER_TEMP}/status.json" <<'NODE'
          process.stdout.write(JSON.stringify({
            state: 'success',
            context: 'pages/release-deployment',
            description: 'Public Pages serves this exact release commit',
            target_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
          }));
          NODE
          curl --fail-with-body --silent --show-error --location \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "https://api.github.com/repos/${REPOSITORY}/statuses/${DEPLOY_SHA}" \
            --data-binary "@${RUNNER_TEMP}/status.json"

  report-failure:
    if: always() && (needs.build.result == 'failure' || needs.deploy.result == 'failure')
    needs: [build, deploy]
    runs-on: ubuntu-slim
    env:
      DEPLOY_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Mark deployment failed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          node --input-type=module > "${RUNNER_TEMP}/status.json" <<'NODE'
          process.stdout.write(JSON.stringify({
            state: 'failure',
            context: 'pages/release-deployment',
            description: 'Pages release deployment failed',
            target_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
          }));
          NODE
          curl --fail-with-body --silent --show-error --location \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "https://api.github.com/repos/${REPOSITORY}/statuses/${DEPLOY_SHA}" \
            --data-binary "@${RUNNER_TEMP}/status.json"
