name: Deploy GitHub Pages

on:
  push:
    branches: ['main']
  pull_request_target:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write
  statuses: write

env:
  DEPLOY_SHA: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.merge_commit_sha || github.sha }}

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.event_name != 'pull_request_target' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deployed commit
        uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Prepare build metadata
        shell: bash
        run: |
          APP_VERSION=$(node -e "process.stdout.write(JSON.parse(require('node:fs').readFileSync('package.json', 'utf8')).version)")
          echo "VITE_APP_VERSION=${APP_VERSION}" >> "$GITHUB_ENV"
          echo "VITE_BUILD_NUMBER=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "VITE_COMMIT_SHA=${DEPLOY_SHA}" >> "$GITHUB_ENV"
          echo "VITE_BUILD_TIME=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_ENV"
      - name: Validate
        run: npm run typecheck && npm run test && npm run build
      - name: Write deployment marker
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { writeFileSync } from 'node:fs';

          const marker = {
            version: process.env.VITE_APP_VERSION,
            build: process.env.VITE_BUILD_NUMBER,
            commit: process.env.VITE_COMMIT_SHA,
            builtAt: process.env.VITE_BUILD_TIME,
          };
          writeFileSync('dist/version.json', `${JSON.stringify(marker, null, 2)}\n`);
          NODE
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request_target' || github.event.pull_request.merged == true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify deployed build marker
        shell: bash
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
          EXPECTED_SHA: ${{ env.DEPLOY_SHA }}
        run: |
          MARKER_URL="${PAGE_URL%/}/version.json"
          for ATTEMPT in $(seq 1 24); do
            MARKER=$(curl --fail --silent --show-error --location \
              "${MARKER_URL}?run=${GITHUB_RUN_ID}&attempt=${ATTEMPT}") || true
            if printf '%s' "$MARKER" | grep -Fq "\"commit\": \"${EXPECTED_SHA}\""; then
              echo "Verified ${EXPECTED_SHA} at ${MARKER_URL}"
              exit 0
            fi
            sleep 5
          done
          echo "::error::The live Pages marker did not report commit ${EXPECTED_SHA}."
          exit 1

  report:
    if: always() && (github.event_name != 'pull_request_target' || github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    needs: [build, deploy]
    steps:
      - name: Report Pages deployment status
        uses: actions/github-script@v7
        env:
          BUILD_RESULT: ${{ needs.build.result }}
          DEPLOY_RESULT: ${{ needs.deploy.result }}
          STATUS_SHA: ${{ env.DEPLOY_SHA }}
        with:
          script: |
            const succeeded =
              process.env.BUILD_RESULT === 'success' &&
              process.env.DEPLOY_RESULT === 'success';
            const description = succeeded
              ? 'GitHub Pages serves this exact commit'
              : `Pages failed: build=${process.env.BUILD_RESULT}, deploy=${process.env.DEPLOY_RESULT}`;
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: process.env.STATUS_SHA,
              state: succeeded ? 'success' : 'failure',
              context: 'pages/deployment',
              description,
              target_url: `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
            });
            if (!succeeded) core.setFailed(description);
