name: Runner Ping

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  statuses: write

jobs:
  ping:
    if: github.event.issue.pull_request && github.event.comment.body == '/runner-ping'
    runs-on: ubuntu-slim
    steps:
      - name: Publish runner status
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          node --input-type=module > "${RUNNER_TEMP}/runner-status.json" <<'NODE'
          const payload = {
            state: 'success',
            context: 'runner/ping',
            description: 'Ubuntu Slim runner executed successfully',
            target_url: `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`,
          };
          process.stdout.write(JSON.stringify(payload));
          NODE
          curl --fail-with-body --silent --show-error --location \
            -X POST \
            -H 'Accept: application/vnd.github+json' \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'X-GitHub-Api-Version: 2026-03-10' \
            "https://api.github.com/repos/${REPOSITORY}/statuses/${COMMIT_SHA}" \
            --data-binary "@${RUNNER_TEMP}/runner-status.json"
